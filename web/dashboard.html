<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sisa Uang — Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="toast" class="toast hidden"></div>

    <div class="dashboard-page">
        <div class="ledger-header">
    <span class="wordmark">Sisa Uang</span>
    <div class="header-actions">
        <a href="analytics.html" class="nav-link">Analitik</a>
        <button id="logout-btn" class="logout">Keluar</button>
    </div>
</div>

<div id="overspend-warning" class="warning-banner hidden">
    <p id="overspend-warning-text"></p>
</div>

        <p id="dashboard-status" class="tx-status hidden"></p>

        <div class="book">
            <div class="page page-left">
                <div class="hero">
                    <p class="eyebrow">Aman dibelanjakan hari ini</p>
                    <p id="daily-safe-spend" class="hero-value">-</p>
                    <span id="date-stamp" class="stamp"></span>
                    <p id="safe-spend-explainer" class="hero-explainer"></p>
                </div>

                <div class="section">
                    <p class="section-label">Bulan ini</p>
                    <div class="ledger-row">
                        <span>Pemasukan</span>
                        <span id="total-income" class="amount">-</span>
                    </div>
                    <div class="ledger-row">
                        <span>Pengeluaran</span>
                        <span id="total-expense" class="amount">-</span>
                    </div>
                    <div class="ledger-row">
                        <span>Sisa</span>
                        <span id="remaining-balance" class="amount">-</span>
                    </div>
                </div>

                <div class="section">
                    <p class="section-label">Anggaran bulanan</p>
                    <form id="budget-form" class="budget-row">
                        <input type="text" inputmode="numeric" id="budget-amount" placeholder="Contoh: 1.500.000" required>
                        <button type="submit" id="budget-submit-btn">Simpan</button>
                    </form>
                    <div class="progress-wrap">
                        <div class="progress-track">
                            <div id="budget-progress-fill" class="progress-fill"></div>
                        </div>
                        <p id="budget-progress-label" class="progress-label"></p>
                    </div>
                </div>
            </div>

            <div class="page page-right">
                <div class="section">
                    <p class="section-label">Catat transaksi baru</p>
                    <form id="transaction-form" class="tx-form">
                        <select id="tx-type" required>
                            <option value="expense">Pengeluaran</option>
                            <option value="income">Pemasukan</option>
                        </select>
                        <input type="text" inputmode="numeric" id="tx-amount" placeholder="Jumlah" required>
                        <input type="text" id="tx-description" placeholder="Keterangan" class="full">
                        <select id="tx-category">
                            <option value="">Tanpa kategori</option>
                        </select>
                        <input type="date" id="tx-date" required>
                        <button type="submit" id="tx-submit-btn" class="full">+ Catat</button>
                        <button type="button" id="tx-cancel-btn" class="full btn-ghost hidden">Batal</button>
                    </form>
                </div>

                <div class="section">
                    <p class="section-label">Riwayat</p>

                    <div class="filter-bar">
                        <select id="filter-type">
                            <option value="">Semua jenis</option>
                            <option value="expense">Pengeluaran</option>
                            <option value="income">Pemasukan</option>
                        </select>
                        <select id="filter-category">
                            <option value="">Semua kategori</option>
                        </select>
                        <input type="month" id="filter-month">
                        <input type="text" id="filter-search" placeholder="Cari keterangan...">
                        <button type="button" id="filter-reset-btn" class="filter-reset">Bersihkan</button>
                    </div>

                    <p id="tx-status" class="tx-status hidden"></p>
                    <ul id="transaction-list"></ul>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
